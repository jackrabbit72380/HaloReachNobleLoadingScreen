<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Jackrabbit72380">
    <title>Holographic Particle Accelerator Controller</title>
    <link rel="stylesheet" type="text/css" href="src/controller.css">
  </head>

  <body>

    <header class="bar">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <h1>Holographic Particle Accelerator <em>Controller</em></h1>
      </div>
      <div class="bar-actions">
        <span id="status" class="status" role="status">connecting…</span>
        <a class="ghost" href="index.html" target="_blank" rel="noopener">Player ↗</a>
      </div>
    </header>

    <main class="layout">

      <section class="stage-wrap" id="stage-wrap">
        <iframe id="stage" src="index.html" title="Holographic Particle Accelerator preview"></iframe>
        <div class="hint" id="hint">Drop a PNG / JPEG / SVG here, or paste one, to swap the target</div>
      </section>

      <aside class="panel">
        <div id="sections"></div>
      </aside>

    </main>

    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

    <script src="src/controller.js"></script>

  </body>

</html>
