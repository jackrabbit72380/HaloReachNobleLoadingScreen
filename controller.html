<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Jackrabbit72380">
    <title>Holographic Particle Accelerator Controller</title>
    <link rel="stylesheet" type="text/css" href="src/controller.css">
  </head>

  <body>

    <header class="bar">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <h1>Holographic Particle Accelerator <em>Controller</em></h1>
      </div>
      <div class="bar-actions">
        <span id="status" class="status" role="status">not connected</span>
        <button id="reset" class="ghost" type="button">Reset</button>
        <a class="ghost" href="index.html" target="_blank" rel="noopener">Open player tab ↗</a>
      </div>
    </header>

    <main class="wrap" id="wrap">

      <section class="section">
        <h2>Particle window</h2>
        <div class="buttons">
          <button id="open-player" type="button">Open particle window</button>
          <button id="focus-player" type="button">Bring to front</button>
          <button id="close-player" type="button">Close</button>
        </div>
        <p class="note" id="connection">Not connected. The particle window opens separately and this panel drives it.</p>
      </section>

      <div id="sections"></div>

    </main>

    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

    <script src="src/controller.js"></script>

    <!-- The Layers panel and the Blob target, beside the controller -->
    <script src="src/layers.js"></script>

  </body>

</html>
