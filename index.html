<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Jackrabbit72380">
    <title>Holographic Particle Accelerator</title>
    <link rel="stylesheet" type="text/css" href="src/controller.css">
    <link rel="stylesheet" type="text/css" href="src/style.css">
  </head>

  <body>

    <!-- Render target -->
    <canvas id="canvas"></canvas>

    <!-- Caption overlay, revealed once the image has assembled -->
    <div id="caption">Holographic Particle Accelerator</div>

    <!-- Boot status, hidden on first frame -->
    <div id="loading">Assembling</div>

    <!-- The controller, docked down the right-hand side. Home opens and closes it. -->
    <aside id="dock" class="dock" aria-hidden="true" aria-label="Controller">
      <div class="dock-bar">
        <span id="status" class="status" role="status">ready</span>
        <button id="reset" class="ghost" type="button">Reset</button>
      </div>
      <div class="wrap" id="wrap">
        <!-- controller.js binds these; there is no second window here, so they stay hidden -->
        <div hidden>
          <button id="open-player" type="button">Open particle window</button>
          <button id="focus-player" type="button">Bring to front</button>
          <button id="close-player" type="button">Close</button>
          <p class="note" id="connection"></p>
        </div>
        <div id="sections"></div>
      </div>
    </aside>

    <div id="dock-hint" role="button" tabindex="0">Home — controls</div>

    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

    <!-- Engine, shapes included -->
    <script src="src/engine.js"></script>

    <!-- The blob target: a sphere the music deforms -->
    <script src="src/blob.js"></script>

    <!-- Keeps the controller window attached if it is reloaded -->
    <script src="src/relay.js"></script>

    <!-- HPA.reset(): puts the shipped settings back -->
    <script src="src/reset.js"></script>

    <!-- HPA.show(): inside spin, visualizer and rainbow autopilot -->
    <script src="src/show.js"></script>

    <!-- HPA.exportModel(): the assembled target as a downloadable model -->
    <script src="src/export.js"></script>

    <!-- HPA.importModel(): a Blender mesh (OBJ / PLY) as the target -->
    <script src="src/import.js"></script>

    <!-- Docks the panel into this window; runs before controller.js, which needs it -->
    <script src="src/dock.js"></script>

    <!-- The whole control panel -->
    <script src="src/controller.js"></script>

    <!-- The 90 degree fix for models that arrive Z-up; needs the Target section above it -->
    <script src="src/model-tilt.js"></script>

    <!-- The Layers panel and the Blob target, beside the controller -->
    <script src="src/layers.js"></script>

    <!-- One Load… for pictures and meshes, in place of two buttons -->
    <script src="src/target-load.js"></script>

    <!-- Runs last: condenses the notes into pills and drops the duplicate ring button -->
    <script src="src/panel-compact.js"></script>

  </body>

</html>
