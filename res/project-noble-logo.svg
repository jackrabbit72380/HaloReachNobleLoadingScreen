<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-label="Project Noble">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8f0f6"/>
      <stop offset="1" stop-color="#93a6b4"/>
    </linearGradient>
  </defs>

  <!-- Emblem (600 x 460 source, aspect 1.305) -->
  <image href="noble-emblem.png" x="110" y="20" width="780" height="598"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark, one row under the emblem, both words the same size -->
  <text x="500" y="745" text-anchor="middle"
        fill="url(#steel)"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="600" letter-spacing="12">PROJECT NOBLE</text>
</svg>
